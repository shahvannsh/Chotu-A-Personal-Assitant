<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chotu — Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #E01020;
    --secondary: #F5C842;
    --accent: #F5C842;
    --dark: #0E1628;
    --darker: #0B1220;
    --text-primary: #F0EDE6;
    --text-secondary: rgba(240,237,230,0.55);
    --border: rgba(240,237,230,0.14);
    --success: #00d66a;
    --error: #ff5555;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
    color: var(--text-primary);
    min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 32px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--darker); z-index: 10;
  }
  .logo { font-family: 'Bangers', cursive; font-weight: 400; font-size: 22px; letter-spacing: 2px; color: var(--secondary); text-shadow: 2px 2px 0 #9B0A18; }
  .nav-links { display: flex; gap: 8px; margin-left: 24px; }
  .nav-btn {
    font-size: 12px; padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--border); color: var(--text-secondary);
    background: transparent; cursor: pointer; text-decoration: none;
  }
  .nav-btn:hover, .nav-btn.active { border-color: var(--secondary); color: var(--secondary); }
  .page { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .page-subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }

  .note-form {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 28px;
  }
  .note-form input, .note-form textarea {
    width: 100%; background: var(--darker); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-primary); font-family: inherit;
    font-size: 14px; padding: 10px 12px; outline: none; margin-bottom: 10px;
  }
  .note-form input:focus, .note-form textarea:focus { border-color: var(--secondary); }
  .note-form textarea { min-height: 90px; resize: vertical; }
  .note-form button {
    background: var(--secondary); color: #04121a; border: none;
    border-radius: 6px; padding: 10px 20px; font-weight: 600;
    font-size: 13px; cursor: pointer;
  }
  .note-form button:disabled { opacity: 0.5; cursor: not-allowed; }
  .form-error { color: var(--error); font-size: 12px; margin-bottom: 8px; display: none; }
  .form-error.visible { display: block; }

  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .note-card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; position: relative;
  }
  .note-title { font-weight: 600; font-size: 14px; margin-bottom: 8px; padding-right: 24px; word-break: break-word; }
  .note-content { color: var(--text-secondary); font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow-y: auto; margin-bottom: 10px; }
  .note-time { color: var(--text-secondary); font-size: 11px; opacity: 0.7; }
  .note-delete {
    position: absolute; top: 12px; right: 12px; background: transparent;
    border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px;
    opacity: 0.5; padding: 2px 6px; border-radius: 4px;
  }
  .note-delete:hover { opacity: 1; color: var(--error); background: rgba(255,85,85,0.1); }

  .empty-state, .loading-state {
    text-align: center; color: var(--text-secondary); font-size: 13px;
    padding: 60px 20px; border: 1px dashed var(--border); border-radius: 10px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">CHOTU</div>
  <div class="nav-links">
    <a class="nav-btn" href="/dashboard.html">Dashboard</a>
    <a class="nav-btn" href="/index.html">AI Chat</a>
    <a class="nav-btn" href="/study.html">Study</a>
    <a class="nav-btn" href="/history.html">History</a>
    <a class="nav-btn active" href="/notes.html">Notes</a>
  </div>
</div>

<div class="page">
  <div class="page-title">Notes</div>
  <div class="page-subtitle">Saved directly to your account — real data, not a mockup.</div>

  <div class="note-form">
    <div class="form-error" id="formError"></div>
    <input type="text" id="noteTitle" placeholder="Title" maxlength="200"/>
    <textarea id="noteContent" placeholder="Write something..."></textarea>
    <button id="saveBtn" onclick="createNote()">Save Note</button>
  </div>

  <div id="notesContainer">
    <div class="loading-state">Loading notes...</div>
  </div>
</div>

<script>
  const token = localStorage.getItem('chotu_token');
  if (!token) {
    window.location.href = '/login.html';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(isoString) {
    if (!isoString) return '';
    const then = new Date(isoString.replace(' ', 'T'));
    const diffMs = Date.now() - then.getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    return `${Math.floor(hours / 24)}d ago`;
  }

  async function authedFetch(path, options = {}) {
    options.headers = Object.assign({ 'Authorization': `Bearer ${token}` }, options.headers || {});
    const res = await fetch(path, options);
    if (res.status === 401) {
      localStorage.removeItem('chotu_token');
      window.location.href = '/login.html';
      throw new Error('Session expired');
    }
    return res;
  }

  function renderNotes(notes) {
    const container = document.getElementById('notesContainer');
    if (!notes.length) {
      container.innerHTML = '<div class="empty-state">No notes yet — save your first one above.</div>';
      return;
    }
    container.innerHTML = '<div class="notes-grid">' + notes.map(n => `
      <div class="note-card">
        <button class="note-delete" onclick="deleteNote(${n.id})" title="Delete">✕</button>
        <div class="note-title">${escapeHtml(n.title || 'Untitled')}</div>
        <div class="note-content">${escapeHtml(n.content || '')}</div>
        <div class="note-time">${timeAgo(n.updated_at || n.created_at)}</div>
      </div>
    `).join('') + '</div>';
  }

  async function loadNotes() {
    try {
      const res = await authedFetch('/notes');
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();
      renderNotes(data.notes || []);
    } catch (e) {
      document.getElementById('notesContainer').innerHTML =
        `<div class="empty-state">Failed to load notes: ${escapeHtml(e.message)}</div>`;
    }
  }

  async function createNote() {
    const titleEl = document.getElementById('noteTitle');
    const contentEl = document.getElementById('noteContent');
    const errEl = document.getElementById('formError');
    const btn = document.getElementById('saveBtn');
    const title = titleEl.value.trim();
    const content = contentEl.value.trim();

    errEl.classList.remove('visible');

    if (!title) {
      errEl.textContent = 'Title is required.';
      errEl.classList.add('visible');
      return;
    }
    if (content.length > 50000) {
      errEl.textContent = 'Content is too long (max 50,000 characters).';
      errEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const res = await authedFetch('/notes/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || `${res.status}`);

      titleEl.value = '';
      contentEl.value = '';
      await loadNotes();
    } catch (e) {
      errEl.textContent = `Failed to save: ${e.message}`;
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Note';
    }
  }

  async function deleteNote(id) {
    if (!confirm('Delete this note?')) return;
    try {
      const res = await authedFetch(`/notes/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(`${res.status}`);
      await loadNotes();
    } catch (e) {
      alert(`Failed to delete note: ${e.message}`);
    }
  }

  loadNotes();
</script>


<div id="chotu-halftone" aria-hidden="true"></div>
<style id="chotu-comic-fx">
/* Ben-Day halftone dots — bold, theme-colored, actually visible this time */
#chotu-halftone{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image: radial-gradient(var(--accent, #E01020) 1.5px, transparent 1.5px);
  background-size: 12px 12px;
  opacity: 0.10;
}

/* CMYK-style misaligned hard print shadows — the real comic-print trick */
button:not(#chotuThemeBtn), .btn, .send-btn, .note-form button, .save-btn, .card, .note-card, .stat-card {
  border: 2px solid var(--text-hi, var(--text-primary, #F0EDE6)) !important;
  box-shadow:
    3px 3px 0px var(--accent2, var(--secondary, #F5C842)),
    6px 6px 0px var(--accent, var(--primary, #E01020)) !important;
  transition: transform .1s ease, box-shadow .1s ease;
}
button:not(#chotuThemeBtn):hover, .btn:hover, .send-btn:hover, .note-form button:hover {
  transform: translate(-3px, -3px);
  box-shadow:
    6px 6px 0px var(--accent2, var(--secondary, #F5C842)),
    9px 9px 0px var(--accent, var(--primary, #E01020)) !important;
}
button:not(#chotuThemeBtn):active, .btn:active, .send-btn:active {
  transform: translate(0, 0);
  box-shadow: 2px 2px 0px var(--accent, var(--primary, #E01020)) !important;
}

/* thick ink outline on message bubbles */
.msg-bubble, .message-bubble, .msg-text {
  border: 2px solid var(--border-hi, var(--border, rgba(240,237,230,0.3))) !important;
}

/* bold diagonal accent stripe, theme-colored */
.topbar, .nav-sidebar, .nav-logo, .page-header {
  position: relative;
}
.topbar::before, .page-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 5px;
  background: repeating-linear-gradient(
    45deg,
    var(--accent, var(--primary, #E01020)) 0px, var(--accent, var(--primary, #E01020)) 10px,
    var(--accent2, var(--secondary, #F5C842)) 10px, var(--accent2, var(--secondary, #F5C842)) 20px
  );
  pointer-events: none;
}

/* bold comic display type for headings */
h1, h2, .page-title, .section-label, .logo, .nav-logo {
  font-family: 'Bangers', cursive !important;
  letter-spacing: 1.5px;
}

/* rotated sticker-style badges/pills */
.badge, .mode-pill, .confidence-badge, .search-pill {
  transform: rotate(-2deg);
  border-width: 2px !important;
  font-weight: 700 !important;
  text-transform: uppercase;
}
.badge:nth-of-type(even), .mode-pill:nth-of-type(even) {
  transform: rotate(2deg);
}

/* speech-bubble tail on chat messages */
.msg.assistant .msg-text, .message.ai .message-bubble, .msg-bubble.assistant {
  position: relative;
}
.msg.assistant .msg-text::before, .message.ai .message-bubble::before {
  content: '';
  position: absolute;
  left: -8px; top: 14px;
  width: 0; height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-right: 8px solid var(--border-hi, var(--border, rgba(240,237,230,0.3)));
}
</style>

<!-- CHOTU THEME SWITCHER -->
<style>
#chotuThemeBtn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--dark);border:2px solid var(--primary);color:var(--primary);font-size:18px;cursor:pointer;z-index:9999;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
#chotuThemeMenu{position:fixed;bottom:72px;right:20px;background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:10px;display:none;flex-direction:column;gap:4px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.5);min-width:150px;}
#chotuThemeMenu.open{display:flex;}
.chotu-theme-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--text-primary);background:transparent;border:none;text-align:left;width:100%;}
.chotu-theme-opt:hover{background:rgba(255,255,255,0.06);}
.chotu-theme-opt.active{background:rgba(255,255,255,0.1);}
.chotu-theme-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.3);}
</style>
<button id="chotuThemeBtn" onclick="document.getElementById('chotuThemeMenu').classList.toggle('open')" title="Change theme">🎨</button>
<div id="chotuThemeMenu"></div>
<script>
const CHOTU_THEMES = {
  crimson: {name:'Crimson',  bg:'#0E1628', surface:'#111D35', surface2:'#162040', border:'rgba(240,237,230,0.10)', borderHi:'rgba(240,237,230,0.22)', accent:'#E01020', accent2:'#F5C842', text:'#F0EDE6', textDim:'rgba(240,237,230,0.45)', textHi:'#F0EDE6', topbarBg:'#1A2F6E', topbarBorder:'#E01020', shadow:'#9B0A18', swatch:'#E01020'},
  azure:   {name:'Azure',    bg:'#0B1526', surface:'#101E38', surface2:'#152847', border:'rgba(220,230,245,0.10)', borderHi:'rgba(220,230,245,0.22)', accent:'#2F6FED', accent2:'#C7D2E0', text:'#EAF0FA', textDim:'rgba(220,230,245,0.45)', textHi:'#EAF0FA', topbarBg:'#14294D', topbarBorder:'#2F6FED', shadow:'#0E1E3D', swatch:'#2F6FED'},
  jade:    {name:'Jade',     bg:'#0A1712', surface:'#0F231A', surface2:'#132D21', border:'rgba(220,245,230,0.10)', borderHi:'rgba(220,245,230,0.22)', accent:'#22C55E', accent2:'#A3E635', text:'#E8F5EC', textDim:'rgba(220,245,230,0.45)', textHi:'#E8F5EC', topbarBg:'#123322', topbarBorder:'#22C55E', shadow:'#0A2417', swatch:'#22C55E'},
  violet:  {name:'Violet',   bg:'#0D0B14', surface:'#16121F', surface2:'#1D1729', border:'rgba(230,220,245,0.10)', borderHi:'rgba(230,220,245,0.22)', accent:'#7C3AED', accent2:'#E5484D', text:'#F0ECF9', textDim:'rgba(230,220,245,0.45)', textHi:'#F0ECF9', topbarBg:'#1C1730', topbarBorder:'#7C3AED', shadow:'#120E1F', swatch:'#7C3AED'},
  steel:   {name:'Steel',    bg:'#12100E', surface:'#1C1815', surface2:'#241F1A', border:'rgba(245,235,220,0.10)', borderHi:'rgba(245,235,220,0.22)', accent:'#D4A017', accent2:'#B0341C', text:'#F5EFE5', textDim:'rgba(245,235,220,0.45)', textHi:'#F5EFE5', topbarBg:'#241F19', topbarBorder:'#D4A017', shadow:'#1A1611', swatch:'#D4A017'},
  storm:   {name:'Storm',    bg:'#0A1420', surface:'#0F1E30', surface2:'#14293F', border:'rgba(225,235,245,0.10)', borderHi:'rgba(225,235,245,0.22)', accent:'#5AB4E5', accent2:'#E8E8F0', text:'#EAF2F8', textDim:'rgba(225,235,245,0.45)', textHi:'#EAF2F8', topbarBg:'#142A44', topbarBorder:'#5AB4E5', shadow:'#0C1D30', swatch:'#5AB4E5'},
  mono:    {name:'Mono',     bg:'#0D0D0D', surface:'#161616', surface2:'#1E1E1E', border:'rgba(230,230,230,0.10)', borderHi:'rgba(230,230,230,0.22)', accent:'#9CA3AF', accent2:'#E5E5E5', text:'#EDEDED', textDim:'rgba(230,230,230,0.45)', textHi:'#EDEDED', topbarBg:'#1A1A1A', topbarBorder:'#9CA3AF', shadow:'#000000', swatch:'#9CA3AF'}
};
function chotuApplyTheme(key){
  var t = CHOTU_THEMES[key]; if(!t) return;
  var r = document.documentElement.style;
  r.setProperty('--primary', t.accent); r.setProperty('--secondary', t.accent2); r.setProperty('--accent', t.accent2);
  r.setProperty('--dark', t.bg); r.setProperty('--darker', t.shadow);
  r.setProperty('--text-primary', t.text); r.setProperty('--text-secondary', t.textDim);
  r.setProperty('--border', t.borderHi);
  localStorage.setItem('chotu-theme', key);
  document.querySelectorAll('.chotu-theme-opt').forEach(function(el){ el.classList.toggle('active', el.dataset.key === key); });
}
(function chotuInitThemeMenu(){
  var menu = document.getElementById('chotuThemeMenu');
  var current = localStorage.getItem('chotu-theme') || 'crimson';
  if (!CHOTU_THEMES[current]) current = 'crimson';
  Object.keys(CHOTU_THEMES).forEach(function(key){
    var t = CHOTU_THEMES[key];
    var btn = document.createElement('button');
    btn.className = 'chotu-theme-opt' + (key === current ? ' active' : '');
    btn.dataset.key = key;
    btn.innerHTML = '<span class="chotu-theme-swatch" style="background:' + t.swatch + '"></span><span>' + t.name + '</span>';
    btn.onclick = function(){ chotuApplyTheme(key); };
    menu.appendChild(btn);
  });
  chotuApplyTheme(current);
})();
</script>

</body>
</html>
