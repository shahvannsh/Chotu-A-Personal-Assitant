<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chotu — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0E1628;--surface:#111D35;--surface2:#162040;
  --border:rgba(240,237,230,0.10);--border-hi:rgba(240,237,230,0.22);
  --accent:#E01020;--warn:#F5C842;--green:#F5C842;--gold:#F5C842;
  --text:#F0EDE6;--text-dim:rgba(240,237,230,0.45);--text-hi:#F0EDE6;
  --mono:'Share Tech Mono',monospace;--sans:'Rajdhani',sans-serif;
}
[data-theme="comic"]{
  --bg:#0E1628;--surface:#111D35;--surface2:#162040;
  --border:rgba(240,237,230,0.10);--border-hi:rgba(240,237,230,0.22);
  --accent:#E01020;--gold:#F5C842;--green:#F5C842;--warn:#F5C842;
  --text:#F0EDE6;--text-dim:rgba(240,237,230,0.45);--text-hi:#F0EDE6;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,200,255,0.008) 2px,rgba(0,200,255,0.008) 4px);pointer-events:none;z-index:0;}
[data-theme="comic"] body::before{background:repeating-conic-gradient(rgba(224,16,32,0.03) 0deg,transparent 1deg,transparent 14deg,rgba(224,16,32,0.03) 15deg);background-size:60px 60px;}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:0 32px;height:60px;background:var(--surface);border-bottom:2px solid var(--accent);}
.logo{font-family:'Bangers',cursive;font-size:22px;color:var(--accent);letter-spacing:4px;}
[data-theme="default"] .logo{font-family:'Share Tech Mono',monospace;font-size:18px;}
.logo span{font-family:'Share Tech Mono',monospace;color:var(--text-dim);font-size:10px;letter-spacing:2px;margin-left:8px;}
.nav-links{display:flex;gap:8px;}
.nav-btn{font-family:var(--mono);font-size:10px;padding:5px 12px;border-radius:3px;border:1px solid var(--border-hi);color:var(--text-dim);background:transparent;cursor:pointer;text-decoration:none;letter-spacing:1px;transition:all .15s;}
.nav-btn:hover,.nav-btn.active{border-color:var(--accent);color:var(--accent);}
.back-btn{margin-left:auto;font-family:var(--mono);font-size:10px;padding:5px 12px;border-radius:3px;border:1px solid var(--border-hi);color:var(--text-dim);background:transparent;cursor:pointer;text-decoration:none;letter-spacing:1px;transition:all .15s;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}

.page{max-width:900px;margin:0 auto;padding:32px 24px;position:relative;z-index:1;}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px;}
.stat-card{background:var(--surface);border:1px solid var(--border-hi);border-radius:8px;padding:20px 24px;position:relative;overflow:hidden;transition:border-color .2s;}
.stat-card:hover{border-color:var(--accent);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat-card.today-card::before{background:var(--accent);}
.stat-card.week-card::before{background:var(--gold);}
.stat-card.streak-card::before{background:var(--warn);}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.stat-value{font-family:'Bangers',cursive;font-size:40px;letter-spacing:2px;line-height:1;}
.stat-card.today-card .stat-value{color:var(--accent);}
.stat-card.week-card  .stat-value{color:var(--gold);}
.stat-card.streak-card .stat-value{color:var(--warn);}
.stat-sub{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:6px;}

.chart-section{background:var(--surface);border:1px solid var(--border-hi);border-radius:8px;padding:24px;margin-bottom:32px;}
.section-title{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:130px;}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0;}
.bar-wrap{width:100%;display:flex;align-items:flex-end;justify-content:center;height:90px;}
.bar-el{width:100%;border-radius:3px 3px 0 0;background:rgba(0,200,255,0.4);transition:background .2s;min-height:2px;}
.bar-el:hover{background:var(--accent);}
.bar-el.today-bar{background:var(--accent);box-shadow:0 0 10px rgba(0,200,255,0.3);}
[data-theme="comic"] .bar-el{background:rgba(224,16,32,0.4);}
[data-theme="comic"] .bar-el:hover,[data-theme="comic"] .bar-el.today-bar{background:#E01020;}
.bar-lbl{font-family:var(--mono);font-size:9px;color:var(--text-dim);text-align:center;white-space:nowrap;}
.bar-val{font-family:var(--mono);font-size:9px;color:var(--text-dim);text-align:center;min-height:12px;}
.no-data{font-family:var(--mono);font-size:12px;color:var(--text-dim);text-align:center;padding:30px;font-style:italic;}

.list-section{background:var(--surface);border:1px solid var(--border-hi);border-radius:8px;padding:24px;}
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.session-list{display:flex;flex-direction:column;gap:8px;}
.session-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;transition:border-color .15s;}
.session-item:hover{border-color:var(--border-hi);}
.session-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;}
.session-dot.is-today{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.session-task{flex:1;font-size:14px;font-weight:600;color:var(--text-hi);word-break:break-word;}
.session-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.session-dur{font-family:var(--mono);font-size:12px;color:var(--accent);}
.session-date{font-family:var(--mono);font-size:10px;color:var(--text-dim);}
.session-time{font-family:var(--mono);font-size:10px;color:var(--text-dim);}
.empty-state{font-family:var(--mono);font-size:13px;color:var(--text-dim);text-align:center;padding:40px 20px;}
.empty-state strong{display:block;font-size:16px;margin-bottom:8px;}

.loading{font-family:var(--mono);font-size:12px;color:var(--text-dim);text-align:center;padding:80px;letter-spacing:2px;}

@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .stat-card.streak-card{grid-column:1/-1;}
  .session-meta{display:none;}
}
</style>
</head>
<body>

<nav class="topbar">
  <div class="logo" id="navLogo">CHOTU <span>SESSION HISTORY</span></div>
  <div class="nav-links">
    <a href="/dashboard.html" class="nav-btn">📊 DASHBOARD</a>
    <a href="/" class="nav-btn">💬 CHAT</a>
    <a href="/study.html" class="nav-btn">📚 STUDY</a>
    <a href="/notes.html" class="nav-btn">📝 NOTES</a>
    <a href="/history.html" class="nav-btn active">📊 HISTORY</a>
  </div>
  <a href="/" class="back-btn">← BACK</a>
</nav>

<div class="page" id="page">
  <div class="loading">loading sessions...</div>
</div>

<script>
// apply saved theme
const savedTheme = localStorage.getItem('chotu-theme') || 'default';
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('navLogo').style.fontFamily = "'Bangers', cursive";

function fmtDur(secs) {
  secs = Math.floor(secs);
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = secs % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + s + 's';
  return s + 's';
}

function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getDayStr(offsetDays) {
  var d = new Date();
  d.setDate(d.getDate() - offsetDays);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getDayLabel(offsetDays) {
  var d = new Date();
  d.setDate(d.getDate() - offsetDays);
  return ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()];
}

async function load() {
  try {
    var token = localStorage.getItem('chotu_token');
    if (!token) { window.location.href = '/login.html'; return; }
    var res = await fetch('/focus-sessions', { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) {
      localStorage.removeItem('chotu_token');
      window.location.href = '/login.html';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('page').innerHTML = '<div class="loading">Failed to load session history: ' + escHtml(e.message) + '</div>';
  }
}

function render(data) {
  var sessions = data.sessions || [];
  var stats    = data.stats || {};
  var fmtData  = data.fmt || {};
  var todayStr = getTodayStr();

  // ── stat cards ──
  var todayDisplay = fmtData.today || '0m';
  var weekDisplay  = fmtData.week  || '0m';
  var streakCount  = stats.streak  || 0;

  var streakHTML = streakCount === 0
    ? '<div class="stat-value" style="font-size:28px;color:var(--text-dim)">0</div><div class="stat-sub">start a session today</div>'
    : '<div style="display:flex;align-items:center;gap:8px"><div class="stat-value">' + streakCount + '</div><div style="font-size:28px">🔥</div></div><div class="stat-sub">' + (streakCount === 1 ? '1 day' : streakCount + ' consecutive days') + '</div>';

  // ── bar chart — last 14 days ──
  var dailyMap = stats.daily || {};
  var chartDays = [];
  for (var i = 13; i >= 0; i--) {
    var iso = getDayStr(i);
    var lbl = getDayLabel(i);
    var secs = dailyMap[iso] || 0;
    chartDays.push({ iso: iso, lbl: lbl, secs: secs });
  }

  var maxSecs = 1;
  for (var j = 0; j < chartDays.length; j++) {
    if (chartDays[j].secs > maxSecs) maxSecs = chartDays[j].secs;
  }

  var hasAnyData = maxSecs > 1;

  var barsHTML = '';
  for (var k = 0; k < chartDays.length; k++) {
    var day = chartDays[k];
    var pct = Math.max((day.secs / maxSecs) * 100, 0);
    var isToday = day.iso === todayStr;
    var valStr = day.secs > 0 ? fmtDur(day.secs) : '';
    barsHTML += '<div class="bar-col">'
      + '<div class="bar-val">' + escHtml(valStr) + '</div>'
      + '<div class="bar-wrap"><div class="bar-el' + (isToday ? ' today-bar' : '') + '" style="height:' + pct.toFixed(1) + '%"></div></div>'
      + '<div class="bar-lbl" style="' + (isToday ? 'color:var(--accent)' : '') + '">' + escHtml(day.lbl) + '</div>'
      + '</div>';
  }

  // ── session list ──
  var listHTML = '';
  if (sessions.length === 0) {
    listHTML = '<div class="empty-state"><strong>No sessions yet</strong>Start a focus session in Chotu, end it properly — it will appear here.</div>';
  } else {
    for (var n = 0; n < sessions.length; n++) {
      var s = sessions[n];
      var startDt  = new Date(s.start);
      var timeStr  = startDt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      var dateStr  = startDt.toLocaleDateString([], {month:'short', day:'numeric'});
      var isToday2 = s.date === todayStr;
      listHTML += '<div class="session-item">'
        + '<div class="session-dot' + (isToday2 ? ' is-today' : '') + '"></div>'
        + '<div class="session-task">' + escHtml(s.task) + '</div>'
        + '<div class="session-meta">'
        + '<div class="session-dur">' + fmtDur(s.duration) + '</div>'
        + '<div class="session-date">' + (isToday2 ? 'today' : escHtml(dateStr)) + '</div>'
        + '<div class="session-time">' + escHtml(timeStr) + '</div>'
        + '</div></div>';
    }
  }

  document.getElementById('page').innerHTML =
    '<div class="stats-grid">'
    + '<div class="stat-card today-card"><div class="stat-label">Today</div><div class="stat-value">' + escHtml(todayDisplay) + '</div><div class="stat-sub">focus time</div></div>'
    + '<div class="stat-card week-card"><div class="stat-label">This week</div><div class="stat-value">' + escHtml(weekDisplay) + '</div><div class="stat-sub">last 7 days</div></div>'
    + '<div class="stat-card streak-card"><div class="stat-label">Streak</div>' + streakHTML + '</div>'
    + '</div>'
    + '<div class="chart-section">'
    + '<div class="section-title">Daily focus — last 14 days</div>'
    + (hasAnyData ? '<div class="bar-chart">' + barsHTML + '</div>' : '<div class="no-data">No sessions in the last 14 days. Start one now.</div>')
    + '</div>'
    + '<div class="list-section">'
    + '<div class="list-header"><div class="section-title" style="margin:0">Session log</div><div style="font-family:var(--mono);font-size:10px;color:var(--text-dim)">' + sessions.length + ' total</div></div>'
    + '<div class="session-list">' + listHTML + '</div>'
    + '</div>';
}

load();
setInterval(load, 30000);
</script>

<div id="chotu-halftone" aria-hidden="true"></div>
<style id="chotu-comic-fx">
/* Ben-Day halftone dots — bold, theme-colored, actually visible this time */
#chotu-halftone{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image: radial-gradient(var(--accent, #E01020) 1.5px, transparent 1.5px);
  background-size: 12px 12px;
  opacity: 0.10;
}

/* CMYK-style misaligned hard print shadows — the real comic-print trick */
button:not(#chotuThemeBtn), .btn, .send-btn, .note-form button, .save-btn, .card, .note-card, .stat-card {
  border: 2px solid var(--text-hi, var(--text-primary, #F0EDE6)) !important;
  box-shadow:
    3px 3px 0px var(--accent2, var(--secondary, #F5C842)),
    6px 6px 0px var(--accent, var(--primary, #E01020)) !important;
  transition: transform .1s ease, box-shadow .1s ease;
}
button:not(#chotuThemeBtn):hover, .btn:hover, .send-btn:hover, .note-form button:hover {
  transform: translate(-3px, -3px);
  box-shadow:
    6px 6px 0px var(--accent2, var(--secondary, #F5C842)),
    9px 9px 0px var(--accent, var(--primary, #E01020)) !important;
}
button:not(#chotuThemeBtn):active, .btn:active, .send-btn:active {
  transform: translate(0, 0);
  box-shadow: 2px 2px 0px var(--accent, var(--primary, #E01020)) !important;
}

/* thick ink outline on message bubbles */
.msg-bubble, .message-bubble, .msg-text {
  border: 2px solid var(--border-hi, var(--border, rgba(240,237,230,0.3))) !important;
}

/* bold diagonal accent stripe, theme-colored */
.topbar, .nav-sidebar, .nav-logo, .page-header {
  position: relative;
}
.topbar::before, .page-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 5px;
  background: repeating-linear-gradient(
    45deg,
    var(--accent, var(--primary, #E01020)) 0px, var(--accent, var(--primary, #E01020)) 10px,
    var(--accent2, var(--secondary, #F5C842)) 10px, var(--accent2, var(--secondary, #F5C842)) 20px
  );
  pointer-events: none;
}

/* bold comic display type for headings */
h1, h2, .page-title, .section-label, .logo, .nav-logo {
  font-family: 'Bangers', cursive !important;
  letter-spacing: 1.5px;
}

/* rotated sticker-style badges/pills */
.badge, .mode-pill, .confidence-badge, .search-pill {
  transform: rotate(-2deg);
  border-width: 2px !important;
  font-weight: 700 !important;
  text-transform: uppercase;
}
.badge:nth-of-type(even), .mode-pill:nth-of-type(even) {
  transform: rotate(2deg);
}

/* speech-bubble tail on chat messages */
.msg.assistant .msg-text, .message.ai .message-bubble, .msg-bubble.assistant {
  position: relative;
}
.msg.assistant .msg-text::before, .message.ai .message-bubble::before {
  content: '';
  position: absolute;
  left: -8px; top: 14px;
  width: 0; height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-right: 8px solid var(--border-hi, var(--border, rgba(240,237,230,0.3)));
}
</style>

<!-- CHOTU THEME SWITCHER -->
<style>
#chotuThemeBtn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-size:18px;cursor:pointer;z-index:9999;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
#chotuThemeMenu{position:fixed;bottom:72px;right:20px;background:var(--surface);border:1px solid var(--border-hi);border-radius:10px;padding:10px;display:none;flex-direction:column;gap:4px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.5);min-width:150px;}
#chotuThemeMenu.open{display:flex;}
.chotu-theme-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:12px;color:var(--text);background:transparent;border:none;text-align:left;width:100%;}
.chotu-theme-opt:hover{background:rgba(255,255,255,0.06);}
.chotu-theme-opt.active{background:rgba(255,255,255,0.1);}
.chotu-theme-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.3);}
</style>
<button id="chotuThemeBtn" onclick="document.getElementById('chotuThemeMenu').classList.toggle('open')" title="Change theme">🎨</button>
<div id="chotuThemeMenu"></div>
<script>
const CHOTU_THEMES = {
  crimson: {name:'Crimson',  bg:'#0E1628', surface:'#111D35', surface2:'#162040', border:'rgba(240,237,230,0.10)', borderHi:'rgba(240,237,230,0.22)', accent:'#E01020', accent2:'#F5C842', text:'#F0EDE6', textDim:'rgba(240,237,230,0.45)', textHi:'#F0EDE6', topbarBg:'#1A2F6E', topbarBorder:'#E01020', shadow:'#9B0A18', swatch:'#E01020'},
  azure:   {name:'Azure',    bg:'#0B1526', surface:'#101E38', surface2:'#152847', border:'rgba(220,230,245,0.10)', borderHi:'rgba(220,230,245,0.22)', accent:'#2F6FED', accent2:'#C7D2E0', text:'#EAF0FA', textDim:'rgba(220,230,245,0.45)', textHi:'#EAF0FA', topbarBg:'#14294D', topbarBorder:'#2F6FED', shadow:'#0E1E3D', swatch:'#2F6FED'},
  jade:    {name:'Jade',     bg:'#0A1712', surface:'#0F231A', surface2:'#132D21', border:'rgba(220,245,230,0.10)', borderHi:'rgba(220,245,230,0.22)', accent:'#22C55E', accent2:'#A3E635', text:'#E8F5EC', textDim:'rgba(220,245,230,0.45)', textHi:'#E8F5EC', topbarBg:'#123322', topbarBorder:'#22C55E', shadow:'#0A2417', swatch:'#22C55E'},
  violet:  {name:'Violet',   bg:'#0D0B14', surface:'#16121F', surface2:'#1D1729', border:'rgba(230,220,245,0.10)', borderHi:'rgba(230,220,245,0.22)', accent:'#7C3AED', accent2:'#E5484D', text:'#F0ECF9', textDim:'rgba(230,220,245,0.45)', textHi:'#F0ECF9', topbarBg:'#1C1730', topbarBorder:'#7C3AED', shadow:'#120E1F', swatch:'#7C3AED'},
  steel:   {name:'Steel',    bg:'#12100E', surface:'#1C1815', surface2:'#241F1A', border:'rgba(245,235,220,0.10)', borderHi:'rgba(245,235,220,0.22)', accent:'#D4A017', accent2:'#B0341C', text:'#F5EFE5', textDim:'rgba(245,235,220,0.45)', textHi:'#F5EFE5', topbarBg:'#241F19', topbarBorder:'#D4A017', shadow:'#1A1611', swatch:'#D4A017'},
  storm:   {name:'Storm',    bg:'#0A1420', surface:'#0F1E30', surface2:'#14293F', border:'rgba(225,235,245,0.10)', borderHi:'rgba(225,235,245,0.22)', accent:'#5AB4E5', accent2:'#E8E8F0', text:'#EAF2F8', textDim:'rgba(225,235,245,0.45)', textHi:'#EAF2F8', topbarBg:'#142A44', topbarBorder:'#5AB4E5', shadow:'#0C1D30', swatch:'#5AB4E5'},
  mono:    {name:'Mono',     bg:'#0D0D0D', surface:'#161616', surface2:'#1E1E1E', border:'rgba(230,230,230,0.10)', borderHi:'rgba(230,230,230,0.22)', accent:'#9CA3AF', accent2:'#E5E5E5', text:'#EDEDED', textDim:'rgba(230,230,230,0.45)', textHi:'#EDEDED', topbarBg:'#1A1A1A', topbarBorder:'#9CA3AF', shadow:'#000000', swatch:'#9CA3AF'}
};
function chotuApplyTheme(key){
  var t = CHOTU_THEMES[key]; if(!t) return;
  var r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--surface', t.surface); r.setProperty('--surface2', t.surface2);
  r.setProperty('--border', t.border); r.setProperty('--border-hi', t.borderHi);
  r.setProperty('--accent', t.accent); r.setProperty('--green', t.accent2); r.setProperty('--warn', t.accent2); r.setProperty('--purple', t.accent2); r.setProperty('--gold', t.accent2);
  r.setProperty('--text', t.text); r.setProperty('--text-dim', t.textDim); r.setProperty('--text-hi', t.textHi);
  r.setProperty('--topbar-bg', t.topbarBg); r.setProperty('--topbar-border', t.topbarBorder);
  localStorage.setItem('chotu-theme', key);
  document.querySelectorAll('.chotu-theme-opt').forEach(function(el){ el.classList.toggle('active', el.dataset.key === key); });
}
(function chotuInitThemeMenu(){
  var menu = document.getElementById('chotuThemeMenu');
  var current = localStorage.getItem('chotu-theme') || 'crimson';
  if (!CHOTU_THEMES[current]) current = 'crimson';
  Object.keys(CHOTU_THEMES).forEach(function(key){
    var t = CHOTU_THEMES[key];
    var btn = document.createElement('button');
    btn.className = 'chotu-theme-opt' + (key === current ? ' active' : '');
    btn.dataset.key = key;
    btn.innerHTML = '<span class="chotu-theme-swatch" style="background:' + t.swatch + '"></span><span>' + t.name + '</span>';
    btn.onclick = function(){ chotuApplyTheme(key); };
    menu.appendChild(btn);
  });
  chotuApplyTheme(current);
})();
</script>

<!-- ═══ CTRL+K SEARCH WIDGET ═══ -->
<div id="ckOverlay" style="display:none;position:fixed;inset:0;background:rgba(11,18,32,0.75);backdrop-filter:blur(4px);z-index:9999;align-items:flex-start;justify-content:center;padding-top:12vh;">
  <div style="width:min(560px,90vw);background:#0E1628;border:1px solid rgba(240,237,230,0.14);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5);overflow:hidden;">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(240,237,230,0.14);">
      <span style="color:rgba(240,237,230,0.4);font-size:15px;">⌕</span>
      <input id="ckInput" type="text" placeholder="Search notes, exams, chat history…" autocomplete="off"
        style="flex:1;background:transparent;border:none;outline:none;color:#F0EDE6;font-family:inherit;font-size:15px;"/>
      <span style="font-family:monospace;font-size:10px;color:rgba(240,237,230,0.35);border:1px solid rgba(240,237,230,0.2);border-radius:4px;padding:2px 6px;">ESC</span>
    </div>
    <div id="ckResults" style="max-height:50vh;overflow-y:auto;"></div>
  </div>
</div>

<button id="ckTrigger" title="Search (Ctrl+K)" onclick="ckOpen()"
  style="position:fixed;bottom:22px;right:22px;z-index:998;width:44px;height:44px;border-radius:50%;background:#0E1628;border:1px solid rgba(240,237,230,0.18);color:#F0EDE6;font-size:16px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,0.35);">⌕</button>

<script>
(function(){
  const overlay = document.getElementById('ckOverlay');
  const input = document.getElementById('ckInput');
  const resultsEl = document.getElementById('ckResults');
  let debounceTimer = null;
  let items = [];
  let activeIndex = -1;

  window.ckOpen = function(){
    overlay.style.display = 'flex';
    input.value = '';
    resultsEl.innerHTML = '';
    items = []; activeIndex = -1;
    setTimeout(() => input.focus(), 30);
  };

  function ckClose(){
    overlay.style.display = 'none';
  }

  function typeIcon(type){
    return { note: '📝', exam: '🎯', chat: '💬' }[type] || '•';
  }

  function render(){
    if (!items.length) {
      resultsEl.innerHTML = input.value.trim()
        ? '<div style="padding:24px 16px;color:rgba(240,237,230,0.4);font-size:13px;text-align:center;">No results</div>'
        : '<div style="padding:24px 16px;color:rgba(240,237,230,0.3);font-size:13px;text-align:center;">Type to search your notes, exams, and chat history</div>';
      return;
    }
    resultsEl.innerHTML = items.map((r, i) => `
      <div class="ck-item" data-idx="${i}" onclick="ckGo(${i})"
        style="display:flex;gap:10px;padding:10px 16px;cursor:pointer;border-left:2px solid ${i===activeIndex ? '#E01020' : 'transparent'};background:${i===activeIndex ? 'rgba(240,237,230,0.05)' : 'transparent'};">
        <span style="font-size:15px;line-height:1.4;">${typeIcon(r.type)}</span>
        <div style="min-width:0;">
          <div style="color:#F0EDE6;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.title || 'Untitled')}</div>
          <div style="color:rgba(240,237,230,0.45);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.snippet || '')}</div>
        </div>
      </div>`).join('');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  window.ckGo = function(i){
    const r = items[i];
    if (!r) return;
    ckClose();
    window.location.href = r.url;
  };

  async function doSearch(q){
    const token = localStorage.getItem('chotu_token');
    if (!token || !q.trim()) { items = []; render(); return; }
    try {
      const res = await fetch('/search?q=' + encodeURIComponent(q), {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) { items = []; render(); return; }
      const data = await res.json();
      items = data.results || [];
      activeIndex = items.length ? 0 : -1;
      render();
    } catch(e) {
      items = []; render();
    }
  }

  input && input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = input.value;
    debounceTimer = setTimeout(() => doSearch(q), 200);
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      overlay.style.display === 'flex' ? ckClose() : ckOpen();
      return;
    }
    if (overlay.style.display !== 'flex') return;
    if (e.key === 'Escape') { ckClose(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) { activeIndex = (activeIndex + 1) % items.length; render(); } }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { activeIndex = (activeIndex - 1 + items.length) % items.length; render(); } }
    if (e.key === 'Enter') { e.preventDefault(); if (activeIndex >= 0) ckGo(activeIndex); }
  });

  overlay && overlay.addEventListener('click', (e) => { if (e.target === overlay) ckClose(); });
})();
</script>
