<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHOTU v2.0 - AI Study Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #FF6B6B; --secondary: #4ECDC4; --accent: #FFE66D; --dark: #0f0f0f; --light: #f5f5f5; }
    body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--light); line-height: 1.6; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    header { padding: 30px 0; border-bottom: 2px solid var(--primary); margin-bottom: 40px; }
    h1 { font-size: 2.5em; color: var(--primary); margin-bottom: 5px; }
    .subtitle { color: #aaa; }
    .navbar { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
    button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
    button:hover { background: #ff5252; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,107,107,0.3); }
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: #222; border: 2px solid var(--secondary); border-radius: 12px; padding: 25px; transition: all 0.3s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(78,205,196,0.3); }
    .card h2 { color: var(--accent); margin-bottom: 15px; font-size: 1.3em; }
    .big-number { font-size: 3em; color: var(--accent); font-weight: 700; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: #222; border: 2px solid var(--primary); border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    input, textarea { width: 100%; padding: 12px; margin: 12px 0; background: #333; border: 1px solid var(--secondary); color: white; border-radius: 6px; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(255,107,107,0.3); }
    .error { color: #FF6B6B; }
    .success { color: #4ECDC4; }
    .chat-box { height: 500px; background: #1a1a1a; border: 1px solid var(--secondary); border-radius: 8px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px; border-radius: 6px; max-width: 80%; }
    .msg.user { background: var(--primary); color: white; align-self: flex-end; }
    .msg.ai { background: var(--secondary); color: #000; align-self: flex-start; }
    .input-area { display: flex; gap: 10px; margin-top: 15px; }
    .input-area input { flex: 1; margin: 0; }
    .input-area button { width: auto; margin: 0; }
    .progress-bar { background: #333; height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, var(--primary), var(--accent)); height: 100%; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
    .tab-btn { background: none; border: none; padding: 10px 20px; color: #aaa; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    @media (max-width: 768px) { h1 { font-size: 1.8em; } .dashboard { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚀 CHOTU v2.0</h1>
    <p class="subtitle">AI-Powered Study Platform with Advanced RAG Chatbot</p>
  </header>

  <div class="navbar">
    <button onclick="loadDashboard()">📊 Dashboard</button>
    <button onclick="openModal('exam-modal')">📝 New Exam</button>
    <button onclick="openModal('notes-modal')">📓 Notes</button>
    <button onclick="openModal('focus-modal')">⏱️ Focus</button>
    <button onclick="openModal('chat-modal')">💬 AI Chat</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <div id="dashboard" class="dashboard">
    <div class="card">
      <h2>📈 Streak</h2>
      <div class="big-number" id="streak">0</div>
      <p>Days Studied</p>
    </div>
    <div class="card">
      <h2>⏱️ Today</h2>
      <div class="big-number" id="today-mins">0</div>
      <p>Minutes</p>
    </div>
    <div class="card">
      <h2>⭐ Points</h2>
      <div class="big-number" id="points">0</div>
      <p>Today's Points</p>
    </div>
    <div class="card">
      <h2>🎯 Goal</h2>
      <div class="progress-bar"><div class="progress-fill" id="goal-bar" style="width:0%"></div></div>
      <p id="goal-text">0/60 min</p>
    </div>
  </div>

  <!-- EXAM MODAL -->
  <div id="exam-modal" class="modal">
    <div class="modal-content">
      <h2>📝 Create New Exam</h2>
      <input type="text" id="exam-name" placeholder="Exam Name">
      <input type="text" id="exam-subject" placeholder="Subject">
      <input type="date" id="exam-date">
      <input type="number" id="exam-hours" placeholder="Estimated Hours" min="1" value="10">
      <button onclick="createExam()">Create</button>
      <button onclick="closeModal('exam-modal')" style="background:#666;">Close</button>
      <p id="exam-err" class="error"></p>
    </div>
  </div>

  <!-- NOTES MODAL -->
  <div id="notes-modal" class="modal">
    <div class="modal-content">
      <h2>📓 My Notes</h2>
      <input type="text" id="note-title" placeholder="Title">
      <textarea id="note-content" placeholder="Content" rows="6"></textarea>
      <button onclick="saveNote()">Save</button>
      <button onclick="closeModal('notes-modal')" style="background:#666;">Close</button>
      <div id="notes-list" style="margin-top:20px;"></div>
      <p id="note-err" class="error"></p>
    </div>
  </div>

  <!-- FOCUS MODAL -->
  <div id="focus-modal" class="modal">
    <div class="modal-content">
      <h2>⏱️ Focus Session</h2>
      <input type="text" id="focus-subject" placeholder="Subject">
      <input type="number" id="focus-duration" placeholder="Minutes" min="1" max="120" value="25">
      <button onclick="startFocus()">Start</button>
      <button onclick="closeModal('focus-modal')" style="background:#666;">Close</button>
      <p id="focus-err" class="error"></p>
    </div>
  </div>

  <!-- CHAT MODAL -->
  <div id="chat-modal" class="modal">
    <div class="modal-content">
      <h2>💬 AI Study Assistant</h2>
      <label style="display:block;margin:15px 0;">
        📤 <span style="cursor:pointer;background:var(--secondary);color:#000;padding:8px 12px;border-radius:4px;">Upload PDF</span>
        <input type="file" id="pdf-upload" accept=".pdf" onchange="uploadPDF()" style="display:none;">
      </label>
      <p id="upload-status" class="success"></p>
      
      <div class="chat-box" id="chat-box"></div>
      
      <div class="input-area">
        <input type="text" id="chat-input" placeholder="Ask me...">
        <button onclick="sendChat()">Send</button>
      </div>
      
      <button onclick="closeModal('chat-modal')" style="background:#666;width:100%;margin-top:15px;">Close</button>
    </div>
  </div>

</div>

<script>
function getToken() { return localStorage.getItem('token'); }
function setToken(t) { localStorage.setItem('token', t); }
function getHeaders() { const t = getToken(); return { 'Content-Type': 'application/json', ...(t && { 'Authorization': `Bearer ${t}` }) }; }
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

async function loginUser() {
  const email = prompt('Email:');
  const name = prompt('Name:');
  if (!email || !name) return;
  try {
    const res = await fetch('/auth/login', { method: 'POST', headers: getHeaders(), body: JSON.stringify({email, name}) });
    const data = await res.json();
    if (res.ok) { setToken(data.token); alert('✅ Login OK'); loadDashboard(); }
    else { alert('❌ ' + data.detail); }
  } catch (e) { alert('❌ ' + e.message); }
}

async function logout() {
  try {
    await fetch('/auth/logout', { method: 'POST', headers: getHeaders() });
    localStorage.removeItem('token');
    alert('Logged out');
    location.reload();
  } catch (e) { console.error(e); }
}

async function loadDashboard() {
  try {
    const s = await fetch('/streaks', { headers: getHeaders() }).then(r => r.json());
    document.getElementById('streak').textContent = s.current_streak || 0;
    const rep = await fetch('/daily-report', { headers: getHeaders() }).then(r => r.json());
    document.getElementById('today-mins').textContent = rep.minutes || 0;
    document.getElementById('points').textContent = rep.points || 0;
    const g = await fetch('/daily-goal', { headers: getHeaders() }).then(r => r.json());
    document.getElementById('goal-bar').style.width = g.progress + '%';
    document.getElementById('goal-text').textContent = `${g.completed_minutes}/${g.goal_minutes} min`;
  } catch (e) { console.error(e); }
}

async function createExam() {
  const name = document.getElementById('exam-name').value.trim();
  const subject = document.getElementById('exam-subject').value.trim();
  const date = document.getElementById('exam-date').value;
  const hours = parseInt(document.getElementById('exam-hours').value) || 10;
  const err = document.getElementById('exam-err');
  err.textContent = '';
  
  if (!name || !subject || !date) { err.textContent = '❌ Fill all'; return; }
  
  try {
    const res = await fetch('/exams/create', { method: 'POST', headers: getHeaders(), body: JSON.stringify({exam_name: name, subject, exam_date: date, estimated_hours: hours}) });
    if (res.ok) { alert('✅ Created'); closeModal('exam-modal'); document.getElementById('exam-name').value = ''; loadDashboard(); }
    else { err.textContent = '❌ Error'; }
  } catch (e) { err.textContent = '❌ ' + e.message; }
}

async function saveNote() {
  const title = document.getElementById('note-title').value.trim();
  const content = document.getElementById('note-content').value.trim();
  const err = document.getElementById('note-err');
  err.textContent = '';
  
  if (!title || !content) { err.textContent = '❌ Fill all'; return; }
  
  try {
    const res = await fetch('/notes/create', { method: 'POST', headers: getHeaders(), body: JSON.stringify({title, content}) });
    if (res.ok) { alert('✅ Saved'); document.getElementById('note-title').value = ''; document.getElementById('note-content').value = ''; loadNotes(); }
    else { err.textContent = '❌ Error'; }
  } catch (e) { err.textContent = '❌ ' + e.message; }
}

async function loadNotes() {
  try {
    const res = await fetch('/notes', { headers: getHeaders() });
    const data = await res.json();
    const list = document.getElementById('notes-list');
    list.innerHTML = '';
    if (data.notes && data.notes.length) {
      data.notes.forEach(n => {
        const el = document.createElement('div');
        el.style.cssText = 'background:#333;padding:12px;margin:10px 0;border-radius:6px;';
        el.innerHTML = `<strong>${n.title}</strong><p style="color:#aaa;margin:8px 0;">${n.content.substring(0,80)}...</p><button onclick="deleteNote(${n.id})" style="background:#ff6b6b;padding:6px 12px;font-size:0.85em;">Delete</button>`;
        list.appendChild(el);
      });
    }
  } catch (e) { console.error(e); }
}

async function deleteNote(id) {
  if (!confirm('Delete?')) return;
  try {
    const res = await fetch(`/notes/${id}`, { method: 'DELETE', headers: getHeaders() });
    if (res.ok) { alert('✅ Deleted'); loadNotes(); }
  } catch (e) { console.error(e); }
}

async function startFocus() {
  const subject = document.getElementById('focus-subject').value.trim();
  const duration = parseInt(document.getElementById('focus-duration').value) || 25;
  const err = document.getElementById('focus-err');
  err.textContent = '';
  
  if (!subject) { err.textContent = '❌ Enter subject'; return; }
  
  try {
    const res = await fetch('/focus-session/start', { method: 'POST', headers: getHeaders(), body: JSON.stringify({subject, duration}) });
    if (res.ok) { alert(`✅ Started for ${duration} min`); closeModal('focus-modal'); }
    else { err.textContent = '❌ Error'; }
  } catch (e) { err.textContent = '❌ ' + e.message; }
}

async function uploadPDF() {
  const file = document.getElementById('pdf-upload').files[0];
  if (!file) return;
  const status = document.getElementById('upload-status');
  status.textContent = '📤 Uploading...';
  
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/upload/pdf', { method: 'POST', headers: { 'Authorization': `Bearer ${getToken()}` }, body: fd });
    const data = await res.json();
    if (res.ok) { status.textContent = `✅ Uploaded (${data.chunks} chunks)`; document.getElementById('pdf-upload').value = ''; }
    else { status.textContent = '❌ Error'; }
  } catch (e) { status.textContent = '❌ ' + e.message; }
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if (!q) return;
  
  addMsg(q, 'user');
  input.value = '';
  
  try {
    const res = await fetch('/chat/ask', { method: 'POST', headers: getHeaders(), body: JSON.stringify({question: q}) });
    const data = await res.json();
    if (res.ok) { addMsg(data.answer, 'ai'); addMsg(`✨ Confidence: ${data.confidence}%`, 'ai'); }
    else { addMsg('❌ Error', 'ai'); }
  } catch (e) { addMsg('❌ ' + e.message, 'ai'); }
}

function addMsg(text, sender) {
  const box = document.getElementById('chat-box');
  const msg = document.createElement('div');
  msg.className = `msg ${sender}`;
  msg.textContent = text;
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

window.addEventListener('load', () => {
  if (!getToken()) loginUser();
  else loadDashboard();
  setInterval(loadDashboard, 5*60*1000);
});

document.addEventListener('keypress', e => {
  if (e.key === 'Enter' && document.getElementById('chat-input') === document.activeElement) sendChat();
});
</script>

</body>
</html>
