<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHOTU v2.0 - AI Study OS with Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #FF6B6B; --secondary: #4ECDC4; --accent: #FFE66D; --dark: #1a1a1a; --light: #f5f5f5; --bg: #0f0f0f; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--light); line-height: 1.6; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    header { padding: 20px 0; border-bottom: 2px solid var(--primary); margin-bottom: 30px; }
    h1 { font-family: 'Bangers', cursive; font-size: 2.5em; color: var(--primary); }
    .navbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .navbar button { flex: 1; min-width: 120px; }
    button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-family: 'Rajdhani'; font-weight: bold; font-size: 1em; transition: all 0.3s; }
    button:hover { background: #ff5252; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,107,107,0.3); }
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: #222; border: 2px solid var(--secondary); border-radius: 10px; padding: 25px; cursor: pointer; transition: all 0.3s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(78,205,196,0.3); }
    .card h2 { color: var(--accent); margin-bottom: 15px; font-size: 1.3em; }
    .card p { font-size: 0.95em; color: #aaa; }
    .streak-display { font-size: 3em; color: var(--accent); font-weight: bold; margin: 10px 0; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto; }
    .modal.open { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: #222; border: 2px solid var(--primary); border-radius: 10px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    input, textarea { width: 100%; padding: 12px; margin: 12px 0; background: #333; border: 1px solid var(--secondary); color: white; border-radius: 6px; font-family: 'Rajdhani'; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(255,107,107,0.3); }
    .error { color: #FF6B6B; font-size: 0.9em; margin-top: 10px; }
    .chat-container { display: flex; flex-direction: column; height: 600px; background: #1a1a1a; border-radius: 10px; border: 2px solid var(--secondary); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
    .message.user { background: var(--primary); color: white; align-self: flex-end; }
    .message.assistant { background: var(--secondary); color: #000; align-self: flex-start; }
    .chat-input-area { padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; margin: 0; padding: 10px; }
    .chat-input-area button { width: auto; margin: 0; }
    .file-upload { margin: 20px 0; }
    .file-label { display: inline-block; padding: 12px 20px; background: var(--secondary); color: #000; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
    .file-label:hover { background: #3ab5ab; }
    #pdf-input { display: none; }
    @media (max-width: 768px) { h1 { font-size: 1.8em; } .dashboard { grid-template-columns: 1fr; } .modal-content { width: 95%; padding: 20px; } .message { max-width: 95%; } .chat-container { height: 400px; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚀 CHOTU v2.0 - AI Study OS</h1>
    <p style="color: #aaa; margin-top: 10px;">Powered by RAG Chatbot & Neural Networks</p>
  </header>

  <div class="navbar">
    <button onclick="loadDashboard()">📊 Dashboard</button>
    <button onclick="openExamModal()">📝 Add Exam</button>
    <button onclick="openNotesModal()">📓 Notes</button>
    <button onclick="openFocusModal()">⏱️ Focus</button>
    <button onclick="openChatModal()">💬 AI Chat</button>
    <button onclick="logoutUser()">🚪 Logout</button>
  </div>

  <div id="dashboard" class="dashboard">
    <div class="card"><h2>📈 Current Streak</h2><p class="streak-display" id="streak-count">0</p><p>Days Studied</p></div>
    <div class="card"><h2>🏆 Best Streak</h2><p class="streak-display" id="streak-best">0</p><p>Personal Record</p></div>
    <div class="card"><h2>⏱️ Today's Study</h2><p class="streak-display" id="today-minutes">0</p><p>Minutes Studied</p></div>
    <div class="card"><h2>⭐ Today's Points</h2><p class="streak-display" id="today-points">0</p><p>Points Earned</p></div>
  </div>

  <div id="exam-modal" class="modal">
    <div class="modal-content">
      <h2>📝 Create New Exam</h2>
      <input type="text" id="exam-name" placeholder="Exam Name">
      <input type="text" id="exam-subject" placeholder="Subject">
      <input type="date" id="exam-date">
      <input type="number" id="exam-hours" placeholder="Estimated Hours" min="1" value="10">
      <button onclick="createExam()">Create Exam</button>
      <button onclick="closeModal('exam-modal')" style="background: #666;">Close</button>
      <p id="exam-error" class="error"></p>
    </div>
  </div>

  <div id="notes-modal" class="modal">
    <div class="modal-content">
      <h2>📓 My Notes</h2>
      <input type="text" id="note-title" placeholder="Note Title">
      <textarea id="note-content" placeholder="Note Content" rows="8"></textarea>
      <button onclick="saveNote()">Save Note</button>
      <button onclick="closeModal('notes-modal')" style="background: #666;">Close</button>
      <div id="notes-list" style="margin-top: 20px;"></div>
      <p id="notes-error" class="error"></p>
    </div>
  </div>

  <div id="focus-modal" class="modal">
    <div class="modal-content">
      <h2>⏱️ Start Focus Session</h2>
      <input type="text" id="focus-subject" placeholder="Subject/Topic">
      <input type="number" id="focus-duration" placeholder="Duration (minutes)" min="1" max="120" value="25">
      <button onclick="startFocusSession()">Start Session</button>
      <button onclick="closeModal('focus-modal')" style="background: #666;">Close</button>
      <p id="focus-error" class="error"></p>
    </div>
  </div>

  <div id="chat-modal" class="modal">
    <div class="modal-content">
      <h2>💬 AI Study Assistant</h2>
      <div class="file-upload">
        <label class="file-label">📤 Upload Study PDF</label>
        <input type="file" id="pdf-input" accept=".pdf" onchange="uploadPDF()">
        <p id="upload-status" style="font-size: 0.9em; margin: 10px 0;"></p>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Ask me anything...">
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
      <button onclick="closeModal('chat-modal')" style="background: #666; margin-top: 15px; width: 100%;">Close</button>
    </div>
  </div>

</div>

<script>
function getToken() { return localStorage.getItem('token'); }
function setToken(token) { localStorage.setItem('token', token); }
function getHeaders() { const token = getToken(); return { 'Content-Type': 'application/json', ...(token && { 'Authorization': `Bearer ${token}` }) }; }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function loginUser() {
  const email = prompt('Enter email:');
  const name = prompt('Enter name:');
  if (!email || !name) return;
  try {
    const res = await fetch('/auth/login', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ email, name }) });
    const data = await res.json();
    if (res.ok) { setToken(data.token); alert('✅ Login successful!'); loadDashboard(); }
    else { alert('❌ Error: ' + (data.detail || 'Failed')); }
  } catch (e) { alert('❌ Error: ' + e.message); }
}

async function logoutUser() {
  try {
    await fetch('/auth/logout', { method: 'POST', headers: getHeaders() });
    localStorage.removeItem('token');
    alert('Logged out');
    window.location.reload();
  } catch (e) { console.error(e); }
}

async function loadDashboard() {
  try {
    const s = await fetch('/streaks', { headers: getHeaders() }).then(r => r.json());
    document.getElementById('streak-count').textContent = s.current_streak || 0;
    document.getElementById('streak-best').textContent = s.longest_streak || 0;
    const r = await fetch('/daily-report', { headers: getHeaders() }).then(x => x.json());
    document.getElementById('today-minutes').textContent = r.minutes || 0;
    document.getElementById('today-points').textContent = r.points || 0;
  } catch (e) { console.error(e); }
}

function openExamModal() { document.getElementById('exam-modal').classList.add('open'); }

async function createExam() {
  const name = document.getElementById('exam-name').value.trim();
  const subject = document.getElementById('exam-subject').value.trim();
  const date = document.getElementById('exam-date').value;
  const hours = parseInt(document.getElementById('exam-hours').value) || 10;
  const err = document.getElementById('exam-error');
  err.textContent = '';
  if (!name || !subject || !date) { err.textContent = '❌ Fill all fields'; return; }
  try {
    const res = await fetch('/exams/create', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ exam_name: name, subject, exam_date: date, estimated_hours: hours }) });
    if (res.ok) { alert('✅ Exam created!'); closeModal('exam-modal'); document.getElementById('exam-name').value = ''; document.getElementById('exam-subject').value = ''; }
    else { err.textContent = '❌ Error'; }
  } catch (e) { err.textContent = '❌ ' + e.message; }
}

function openNotesModal() { document.getElementById('notes-modal').classList.add('open'); loadNotes(); }

async function saveNote() {
  const title = document.getElementById('note-title').value.trim();
  const content = document.getElementById('note-content').value.trim();
  const err = document.getElementById('notes-error');
  err.textContent = '';
  if (!title || !content) { err.textContent = '❌ Fill all fields'; return; }
  try {
    const res = await fetch('/notes/create', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ title, content }) });
    if (res.ok) { alert('✅ Saved!'); document.getElementById('note-title').value = ''; document.getElementById('note-content').value = ''; loadNotes(); }
    else { err.textContent = '❌ Error'; }
  } catch (e) { err.textContent = '❌ ' + e.message; }
}

async function loadNotes() {
  try {
    const res = await fetch('/notes', { headers: getHeaders() });
    const data = await res.json();
    const list = document.getElementById('notes-list');
    list.innerHTML = '';
    if (data.notes && data.notes.length) {
      data.notes.forEach((n) => {
        const el = document.createElement('div');
        el.style.cssText = 'background: #333; padding: 12px; margin: 12px 0; border-radius: 6px; border-left: 3px solid var(--accent);';
        el.innerHTML = `<strong style="color: var(--accent);">${n.title}</strong><p style="margin-top: 8px; color: #aaa;">${n.content.substring(0, 80)}...</p><button onclick="deleteNote(${n.id})" style="background: #ff6b6b; padding: 6px 12px; font-size: 0.85em; margin-top: 8px;">Delete</button>`;
        list.appendChild(el);
      });
    } else { list.innerHTML = '<p style="color: #aaa;">No notes yet</p>'; }
  } catch (e) { console.error(e); }
}

async function deleteNote(id) {
  if (!confirm('Delete?')) return;
  try {
    const res = await fetch(`/notes/${id}`, { method: 'DELETE', headers: getHeaders() });
    if (res.ok) { alert('✅ Deleted'); loadNotes(); }
  } catch (e) { console.error(e); }
}

function openFocusModal() { document.getElementById('focus-modal').classList.add('open'); }

async function startFocusSession() {
  const subject = document.getElementById('focus-subject').value.trim();
  const duration = parseInt(document.getElementById('focus-duration').value) || 25;
  const err = document.getElementById('focus-error');
  err.textContent = '';
  if (!subject) { err.textContent = '❌ Enter subject'; return; }
  try {
    const res = await fetch('/focus-session/start', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ subject, duration }) });
    if (res.ok) { alert(`✅ Started for ${duration} min`); closeModal('focus-modal'); document.getElementById('focus-subject').value = ''; }
    else { err.textContent = '❌ Error'; }
  } catch (e) { err.textContent = '❌ ' + e.message; }
}

function openChatModal() { document.getElementById('chat-modal').classList.add('open'); loadChatHistory(); }

async function uploadPDF() {
  const file = document.getElementById('pdf-input').files[0];
  if (!file) return;
  const status = document.getElementById('upload-status');
  status.textContent = '📤 Uploading...';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/upload/pdf', { method: 'POST', headers: { 'Authorization': `Bearer ${getToken()}` }, body: fd });
    const data = await res.json();
    if (res.ok) { status.textContent = `✅ Uploaded! (${data.chunks} chunks)`; document.getElementById('pdf-input').value = ''; }
    else { status.textContent = '❌ Error'; }
  } catch (e) { status.textContent = '❌ ' + e.message; }
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  input.value = '';
  try {
    const res = await fetch('/chat/ask', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ question: q }) });
    const data = await res.json();
    if (res.ok) { addMsg(data.answer, 'assistant'); }
    else { addMsg('❌ Error', 'assistant'); }
  } catch (e) { addMsg('❌ ' + e.message, 'assistant'); }
}

function addMsg(text, sender) {
  const div = document.getElementById('chat-messages');
  const msg = document.createElement('div');
  msg.className = `message ${sender}`;
  msg.textContent = text;
  div.appendChild(msg);
  div.scrollTop = div.scrollHeight;
}

async function loadChatHistory() {
  try {
    const res = await fetch('/chat/history', { headers: getHeaders() });
    const data = await res.json();
    document.getElementById('chat-messages').innerHTML = '';
    if (data.history && data.history.length) {
      data.history.slice(-3).reverse().forEach((m) => { addMsg(m.question, 'user'); addMsg(m.answer, 'assistant'); });
    } else { addMsg('👋 Welcome! Upload a PDF or ask me anything.', 'assistant'); }
  } catch (e) { console.error(e); }
}

window.addEventListener('load', () => {
  if (!getToken()) loginUser();
  else loadDashboard();
  setInterval(loadDashboard, 5*60*1000);
});

document.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && document.getElementById('chat-input') === document.activeElement) sendMessage();
});
</script>

</body>
</html>
