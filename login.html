<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chotu — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0E1628;--surface:#111D35;--accent:#E01020;--text:#F0EDE6;--text-hi:#F0EDE6;--text-dim:rgba(240,237,230,0.45);--border:#1A2F6E;--mono:'Share Tech Mono',monospace;--sans:'Rajdhani',sans-serif;--logo-font:'Bangers',cursive;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;align-items:center;justify-content:center;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(224,16,32,0.02) 2px,rgba(224,16,32,0.02) 4px);pointer-events:none;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(224,16,32,0.08) 0%,transparent 60%);pointer-events:none;}

.card{position:relative;z-index:1;background:var(--surface);border:1px solid #1A2F6E;border-radius:12px;padding:48px 40px;width:380px;max-width:95vw;text-align:center;box-shadow:0 0 60px rgba(224,16,32,0.10);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:12px 12px 0 0;}

.logo{font-family:var(--logo-font);font-size:38px;color:var(--accent);letter-spacing:4px;text-shadow:2px 2px 0 #9B0A18;margin-bottom:6px;}
.tagline{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:2px;margin-bottom:40px;}

.divider{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:2px;}

.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 20px;background:white;border:none;border-radius:6px;cursor:pointer;text-decoration:none;font-family:var(--sans);font-size:15px;font-weight:600;color:#1a1a1a;transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.google-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.google-btn svg{width:20px;height:20px;flex-shrink:0;}

.features{margin-top:36px;display:flex;flex-direction:column;gap:8px;}
.feature{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;text-align:left;}
.feature-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}

.error-msg{font-family:var(--mono);font-size:11px;color:#ff6b35;margin-top:16px;display:none;}
.error-msg.visible{display:block;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CHOTU</div>
  <div class="tagline">PERSONAL AI PRODUCTIVITY ASSISTANT</div>

  <div class="divider"><span>SIGN IN TO CONTINUE</span></div>

  <div style="display:flex;flex-direction:column;gap:12px;text-align:left;">
    <div>
      <label style="font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;">NAME</label>
      <input id="loginName" type="text" placeholder="Your name" style="width:100%;margin-top:6px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text-hi);font-family:var(--sans);font-size:14px;outline:none;"/>
    </div>
    <div>
      <label style="font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;">EMAIL</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" style="width:100%;margin-top:6px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text-hi);font-family:var(--sans);font-size:14px;outline:none;"/>
    </div>
    <div>
      <label style="font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;">PASSWORD</label>
      <input id="loginPassword" type="password" placeholder="8+ characters" style="width:100%;margin-top:6px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text-hi);font-family:var(--sans);font-size:14px;outline:none;"/>
      <div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:4px;">New email? This creates your account. Existing email? This must match.</div>
    </div>
    <button id="loginBtn" onclick="doLogin()" style="width:100%;padding:14px 20px;background:var(--accent);border:none;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:15px;font-weight:600;color:#04121a;">Sign In</button>
  </div>

  <!--
    NOTE: This app's backend (app.py) has no Google OAuth route implemented,
    despite requirements.txt including authlib/google-auth. The old
    "Continue with Google" button linked to a route that doesn't exist for
    OAuth and would 405 immediately (it's a POST-only JSON endpoint).
    This is email+name+password login against POST /auth/login. Password
    is required as of the auth fix below — previously any email with no
    password logged in as whichever account owned that email.
  -->

  <div class="features">
    <div class="feature"><div class="feature-dot"></div>Focus sessions with idle detection</div>
    <div class="feature"><div class="feature-dot"></div>AI chat with web search</div>
    <div class="feature"><div class="feature-dot"></div>Study mode with quiz generation</div>
    <div class="feature"><div class="feature-dot"></div>Session history and streaks</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('error')) {
  const el = document.getElementById('errorMsg');
  el.textContent = 'Sign in failed. Please try again.';
  el.classList.add('visible');
}

// If already logged in, skip straight to the app
if (localStorage.getItem('chotu_token')) {
  window.location.href = '/index.html';
}

async function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('errorMsg');
  const btn = document.getElementById('loginBtn');

  if (!email || !email.includes('@')) {
    errEl.textContent = 'Enter a valid email.';
    errEl.classList.add('visible');
    return;
  }

  if (!password || password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.classList.add('visible');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errEl.classList.remove('visible');

  try {
    const response = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, name: name || 'User', password })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`Login failed (${response.status}): ${errText}`);
    }

    const data = await response.json();
    localStorage.setItem('chotu_token', data.token);
    localStorage.setItem('chotu_user', JSON.stringify(data.user));
    window.location.href = '/index.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>

<div id="chotu-halftone" aria-hidden="true"></div>
<style id="chotu-comic-fx">
/* Ben-Day halftone dots — bold, theme-colored, actually visible this time */
#chotu-halftone{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image: radial-gradient(var(--accent, #E01020) 1.5px, transparent 1.5px);
  background-size: 12px 12px;
  opacity: 0.10;
}

/* CMYK-style misaligned hard print shadows — the real comic-print trick */
button:not(#chotuThemeBtn), .btn, .send-btn, .note-form button, .save-btn, .card, .note-card, .stat-card {
  border: 2px solid var(--text-hi, var(--text-primary, #F0EDE6)) !important;
  box-shadow:
    3px 3px 0px var(--accent2, var(--secondary, #F5C842)),
    6px 6px 0px var(--accent, var(--primary, #E01020)) !important;
  transition: transform .1s ease, box-shadow .1s ease;
}
button:not(#chotuThemeBtn):hover, .btn:hover, .send-btn:hover, .note-form button:hover {
  transform: translate(-3px, -3px);
  box-shadow:
    6px 6px 0px var(--accent2, var(--secondary, #F5C842)),
    9px 9px 0px var(--accent, var(--primary, #E01020)) !important;
}
button:not(#chotuThemeBtn):active, .btn:active, .send-btn:active {
  transform: translate(0, 0);
  box-shadow: 2px 2px 0px var(--accent, var(--primary, #E01020)) !important;
}

/* thick ink outline on message bubbles */
.msg-bubble, .message-bubble, .msg-text {
  border: 2px solid var(--border-hi, var(--border, rgba(240,237,230,0.3))) !important;
}

/* bold diagonal accent stripe, theme-colored */
.topbar, .nav-sidebar, .nav-logo, .page-header {
  position: relative;
}
.topbar::before, .page-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 5px;
  background: repeating-linear-gradient(
    45deg,
    var(--accent, var(--primary, #E01020)) 0px, var(--accent, var(--primary, #E01020)) 10px,
    var(--accent2, var(--secondary, #F5C842)) 10px, var(--accent2, var(--secondary, #F5C842)) 20px
  );
  pointer-events: none;
}

/* bold comic display type for headings */
h1, h2, .page-title, .section-label, .logo, .nav-logo {
  font-family: 'Bangers', cursive !important;
  letter-spacing: 1.5px;
}

/* rotated sticker-style badges/pills */
.badge, .mode-pill, .confidence-badge, .search-pill {
  transform: rotate(-2deg);
  border-width: 2px !important;
  font-weight: 700 !important;
  text-transform: uppercase;
}
.badge:nth-of-type(even), .mode-pill:nth-of-type(even) {
  transform: rotate(2deg);
}

/* speech-bubble tail on chat messages */
.msg.assistant .msg-text, .message.ai .message-bubble, .msg-bubble.assistant {
  position: relative;
}
.msg.assistant .msg-text::before, .message.ai .message-bubble::before {
  content: '';
  position: absolute;
  left: -8px; top: 14px;
  width: 0; height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-right: 8px solid var(--border-hi, var(--border, rgba(240,237,230,0.3)));
}
</style>

<!-- CHOTU THEME SWITCHER -->
<style>
#chotuThemeBtn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-size:18px;cursor:pointer;z-index:9999;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
#chotuThemeMenu{position:fixed;bottom:72px;right:20px;background:var(--surface);border:1px solid var(--border-hi);border-radius:10px;padding:10px;display:none;flex-direction:column;gap:4px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.5);min-width:150px;}
#chotuThemeMenu.open{display:flex;}
.chotu-theme-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:12px;color:var(--text);background:transparent;border:none;text-align:left;width:100%;}
.chotu-theme-opt:hover{background:rgba(255,255,255,0.06);}
.chotu-theme-opt.active{background:rgba(255,255,255,0.1);}
.chotu-theme-swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.3);}
</style>
<button id="chotuThemeBtn" onclick="document.getElementById('chotuThemeMenu').classList.toggle('open')" title="Change theme">🎨</button>
<div id="chotuThemeMenu"></div>
<script>
const CHOTU_THEMES = {
  crimson: {name:'Crimson',  bg:'#0E1628', surface:'#111D35', surface2:'#162040', border:'rgba(240,237,230,0.10)', borderHi:'rgba(240,237,230,0.22)', accent:'#E01020', accent2:'#F5C842', text:'#F0EDE6', textDim:'rgba(240,237,230,0.45)', textHi:'#F0EDE6', topbarBg:'#1A2F6E', topbarBorder:'#E01020', shadow:'#9B0A18', swatch:'#E01020'},
  azure:   {name:'Azure',    bg:'#0B1526', surface:'#101E38', surface2:'#152847', border:'rgba(220,230,245,0.10)', borderHi:'rgba(220,230,245,0.22)', accent:'#2F6FED', accent2:'#C7D2E0', text:'#EAF0FA', textDim:'rgba(220,230,245,0.45)', textHi:'#EAF0FA', topbarBg:'#14294D', topbarBorder:'#2F6FED', shadow:'#0E1E3D', swatch:'#2F6FED'},
  jade:    {name:'Jade',     bg:'#0A1712', surface:'#0F231A', surface2:'#132D21', border:'rgba(220,245,230,0.10)', borderHi:'rgba(220,245,230,0.22)', accent:'#22C55E', accent2:'#A3E635', text:'#E8F5EC', textDim:'rgba(220,245,230,0.45)', textHi:'#E8F5EC', topbarBg:'#123322', topbarBorder:'#22C55E', shadow:'#0A2417', swatch:'#22C55E'},
  violet:  {name:'Violet',   bg:'#0D0B14', surface:'#16121F', surface2:'#1D1729', border:'rgba(230,220,245,0.10)', borderHi:'rgba(230,220,245,0.22)', accent:'#7C3AED', accent2:'#E5484D', text:'#F0ECF9', textDim:'rgba(230,220,245,0.45)', textHi:'#F0ECF9', topbarBg:'#1C1730', topbarBorder:'#7C3AED', shadow:'#120E1F', swatch:'#7C3AED'},
  steel:   {name:'Steel',    bg:'#12100E', surface:'#1C1815', surface2:'#241F1A', border:'rgba(245,235,220,0.10)', borderHi:'rgba(245,235,220,0.22)', accent:'#D4A017', accent2:'#B0341C', text:'#F5EFE5', textDim:'rgba(245,235,220,0.45)', textHi:'#F5EFE5', topbarBg:'#241F19', topbarBorder:'#D4A017', shadow:'#1A1611', swatch:'#D4A017'},
  storm:   {name:'Storm',    bg:'#0A1420', surface:'#0F1E30', surface2:'#14293F', border:'rgba(225,235,245,0.10)', borderHi:'rgba(225,235,245,0.22)', accent:'#5AB4E5', accent2:'#E8E8F0', text:'#EAF2F8', textDim:'rgba(225,235,245,0.45)', textHi:'#EAF2F8', topbarBg:'#142A44', topbarBorder:'#5AB4E5', shadow:'#0C1D30', swatch:'#5AB4E5'},
  mono:    {name:'Mono',     bg:'#0D0D0D', surface:'#161616', surface2:'#1E1E1E', border:'rgba(230,230,230,0.10)', borderHi:'rgba(230,230,230,0.22)', accent:'#9CA3AF', accent2:'#E5E5E5', text:'#EDEDED', textDim:'rgba(230,230,230,0.45)', textHi:'#EDEDED', topbarBg:'#1A1A1A', topbarBorder:'#9CA3AF', shadow:'#000000', swatch:'#9CA3AF'}
};
function chotuApplyTheme(key){
  var t = CHOTU_THEMES[key]; if(!t) return;
  var r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--surface', t.surface); r.setProperty('--surface2', t.surface2);
  r.setProperty('--border', t.border); r.setProperty('--border-hi', t.borderHi);
  r.setProperty('--accent', t.accent); r.setProperty('--green', t.accent2); r.setProperty('--warn', t.accent2); r.setProperty('--purple', t.accent2); r.setProperty('--gold', t.accent2);
  r.setProperty('--text', t.text); r.setProperty('--text-dim', t.textDim); r.setProperty('--text-hi', t.textHi);
  r.setProperty('--topbar-bg', t.topbarBg); r.setProperty('--topbar-border', t.topbarBorder);
  localStorage.setItem('chotu-theme', key);
  document.querySelectorAll('.chotu-theme-opt').forEach(function(el){ el.classList.toggle('active', el.dataset.key === key); });
}
(function chotuInitThemeMenu(){
  var menu = document.getElementById('chotuThemeMenu');
  var current = localStorage.getItem('chotu-theme') || 'crimson';
  if (!CHOTU_THEMES[current]) current = 'crimson';
  Object.keys(CHOTU_THEMES).forEach(function(key){
    var t = CHOTU_THEMES[key];
    var btn = document.createElement('button');
    btn.className = 'chotu-theme-opt' + (key === current ? ' active' : '');
    btn.dataset.key = key;
    btn.innerHTML = '<span class="chotu-theme-swatch" style="background:' + t.swatch + '"></span><span>' + t.name + '</span>';
    btn.onclick = function(){ chotuApplyTheme(key); };
    menu.appendChild(btn);
  });
  chotuApplyTheme(current);
})();
</script>

</body>
</html>
